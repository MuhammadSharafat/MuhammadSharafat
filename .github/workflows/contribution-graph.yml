name: Update Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate contribution graph
        uses: pipipi-dev/gcchart@v1
        with:
          outputs: |
            contributions.svg?theme=dark&style=clean&cumulative=false
